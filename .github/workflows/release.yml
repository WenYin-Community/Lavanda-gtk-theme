name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack source tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="Lavanda-gtk-theme-${VERSION}/" \
            -o "Lavanda-gtk-theme-${VERSION}.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "Lavanda-gtk-theme-${VERSION}.tar.gz" > "Lavanda-gtk-theme-${VERSION}.tar.gz.sha256"

      - name: Create release and upload tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=".github/release-notes/${VERSION}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              Lavanda-gtk-theme-*.tar.gz Lavanda-gtk-theme-*.tar.gz.sha256 \
              --title "Lavanda-gtk-theme ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" \
              Lavanda-gtk-theme-*.tar.gz Lavanda-gtk-theme-*.tar.gz.sha256 \
              --title "Lavanda-gtk-theme ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
