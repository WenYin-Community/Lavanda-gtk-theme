name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source archive
        run: |
          set -euo pipefail
          name="Lavanda-${GITHUB_REF_NAME}"
          mkdir -p "dist/${name}"
          git archive --format=tar HEAD | tar -x -C "dist/${name}"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          echo "Archive contents:"
          tar -tzf "dist/${name}.tar.gz" | head -20

      - name: Prepare release notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" /tmp/release-notes.md
          else
            echo "Release ${GITHUB_REF_NAME}" > /tmp/release-notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: dist/*.tar.gz
          draft: false
          prerelease: false
